[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-betbuilder-research"
version = "0.1.0"
description = "Reproducible descriptive NBA research with audited legacy calculations"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
nba-research = "nba_research.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["nba_research*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: requires locally supplied real CSV or generated outputs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.package-data]
nba_research = ["acca_template.json"]

[project.optional-dependencies]
excel = ["openpyxl==3.1.5"]
